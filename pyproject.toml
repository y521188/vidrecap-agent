[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidrecap-agent"
version = "0.1.0"
description = "Divide-and-conquer summarization for hours-long videos: overlapped time sharding, incremental partial recaps, binary recursive context compression."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "y521188" }]
keywords = ["llm", "agent", "video-summarization", "map-reduce", "long-context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
vidrecap = "vidrecap.user.api:main"

[tool.setuptools.packages.find]
include = ["vidrecap*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
